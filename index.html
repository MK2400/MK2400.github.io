<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }

</head>
<body>
  <canvas id="scene" aria-label="Interactive solar system: the sun is my profile and each planet is a project"></canvas>
  <div id="labels" aria-hidden="false"></div>

  <header class="topbar">
    <a class="brand" href="#" id="brand" aria-label="Back to overview">
      <span class="brand__mark" id="brand-mark"></span>
      <span class="brand__text">
        <strong id="brand-name"></strong>
        <small id="brand-title"></small>
      </span>
    </a>
    <div class="topbar__actions">
      <button class="btn btn--ghost" id="toggle-classic" type="button">Classic view</button>
      <a class="btn btn--primary" id="cv-link" download>Download CV</a>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Introduction">
    <p class="hero__eyebrow" id="hero-eyebrow"></p>
    <h1 class="hero__name" id="hero-name"></h1>
    <p class="hero__tagline" id="hero-tagline"></p>
    <ul class="hero__stats" id="hero-stats"></ul>
    <p class="hero__hint"><span class="pulse"></span> Click the sun or any planet to explore · drag to rotate · scroll to zoom</p>
  </section>

  <nav class="dock" id="dock" aria-label="Sections"></nav>

  <aside class="panel" id="panel" aria-hidden="true" aria-live="polite">
    <button class="panel__close" id="panel-close" type="button" aria-label="Close panel">✕</button>
    <div class="panel__scroll" id="panel-body"></div>
  </aside>

  <main class="classic" id="classic" hidden></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Close">✕</button>
    <img alt="">
    <p class="lightbox__caption"></p>
  </div>

  <div class="loader" id="loader"><div class="loader__sun"></div><p>Igniting the sun…</p></div>

  <noscript>
    <div class="noscript">
      <h1>Mohammad Khallouf — Senior Flutter Developer</h1>
      <p>This portfolio is interactive and needs JavaScript. You can still <a href="assets/cv/Mohammad-Khallouf-CV.pdf">download my CV</a> or email <a href="mailto:mohammad.khallouf3@gmail.com">mohammad.khallouf3@gmail.com</a>.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
